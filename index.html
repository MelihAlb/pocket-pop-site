<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Pop — ALB Studio</title>
<meta name="description" content="Pocket Pop, ALB Studio tarafından geliştirilen bir mobil bulmaca oyunudur.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0a0d14; color: #eaf0fb; padding: 40px 20px;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .field {
    position: fixed; inset: -10%; pointer-events: none; opacity: .5; z-index: 0;
    background:
      radial-gradient(26vmin 26vmin at 8% 15%, rgba(243,57,32,.85), transparent 68%),
      radial-gradient(23vmin 23vmin at 93% 17%, rgba(113,243,32,.78), transparent 68%),
      radial-gradient(30vmin 30vmin at 10% 87%, rgba(51,167,225,.88), transparent 68%),
      radial-gradient(27vmin 27vmin at 90% 90%, rgba(255,95,208,.82), transparent 68%);
  }
  main { position: relative; z-index: 1; max-width: 460px; text-align: center; }
  h1 { font-size: 46px; margin: 0 0 6px; letter-spacing: -.03em; line-height: .95; }
  h1 span { color: #4fd1ff; }
  .studio { color: #93a1b8; font-size: 13px; letter-spacing: .22em; font-weight: 800; margin: 0 0 26px; }
  p { color: #c3cddd; margin: 0 0 30px; }
  .links { display: flex; flex-direction: column; gap: 10px; }
  a.btn {
    display: block; padding: 13px 18px; border-radius: 14px; text-decoration: none;
    border: 1px solid rgba(234,240,251,.16); background: rgba(19,26,40,.75);
    color: #eaf0fb; font-weight: 700;
  }
  a.btn:hover { border-color: #4fd1ff; color: #4fd1ff; }
  footer { margin-top: 34px; color: #6e7d95; font-size: 12.5px; }
  footer a { color: #93a1b8; }
</style>
</head>
<body>
<div class="field" aria-hidden="true"></div>
<main>
  <h1>Pocket<br><span>Pop</span></h1>
  <p class="studio">ALB STUDIO</p>
  <p>Topları eşle, tüpleri patlat. Tek elle, otuz saniyede öğrenilen bir bulmaca.</p>
  <div class="links">
    <a class="btn" href="privacy.html">Gizlilik Politikası · Privacy Policy</a>
    <a class="btn" href="veri-silme.html">Veri Silme · Data Deletion</a>
    <a class="btn" href="mailto:alb.studiolab@gmail.com">Destek · Support — alb.studiolab@gmail.com</a>
  </div>
  <footer>
    com.melihalb.pocketpop · <a href="mailto:alb.studiolab@gmail.com">alb.studiolab@gmail.com</a>
  </footer>
</main>
</body>
</html>
